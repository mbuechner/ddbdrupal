# DDBpro test profile.
naming:
  enforceReleaseNamespaceMatch: true
  allowedReleaseNames:
    - ddbpro-t

commonAnnotations:
  dnb.contact/emails: m.buechner@dnb.de
  dnb.contact/persons: Michael Büchner

# Für upgrade-kompatibles Verhalten bewahrt dieses Profil die bisherigen
# Chart-Defaults für VPA und RWX-Persistenz ausdrücklich.
verticalPodAutoscaler:
  enabled: true

drupal:
  externalHost: pro-t.deutsche-digitale-bibliothek.de
  image:
    preset: ddbpro-test
    pullPolicy: Always
  persistence:
    accessModes:
      - ReadWriteMany

redis:
  persistence:
    accessModes:
      - ReadWriteMany

database:
  persistence:
    accessModes:
      - ReadWriteMany
