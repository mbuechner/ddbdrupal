# DDBpro test profile. Set the real external host before installation.
nameOverride: ddbpro

naming:
  enforceReleaseNamespaceMatch: true
  allowedReleaseNames:
    - ddbpro-t

commonAnnotations:
  dnb.contact/emails: m.buechner@dnb.de
  dnb.contact/persons: Michael Büchner

# Für upgrade-kompatibles Verhalten bewahrt dieses Profil die bisherigen
# Chart-Defaults für VPA und RWX-Persistenz ausdrücklich.
verticalPodAutoscaler:
  enabled: true

drupal:
  externalHost: ddbpro-test.example.invalid
  image:
    repository: ghcr.io/deutsche-digitale-bibliothek/ddbpro
    tag: test
    pullPolicy: Always
  persistence:
    accessModes:
      - ReadWriteMany

redis:
  persistence:
    accessModes:
      - ReadWriteMany

database:
  auth:
    database: ddbprodb
    username: ddbpro
  persistence:
    accessModes:
      - ReadWriteMany
