# Wiederverwendbare Drupal-Umgebung für Kubernetes und OpenShift.
# Website-spezifische Einstellungen stehen in values-*.yaml.

# Überschreibt ausschließlich das app.kubernetes.io/name-Label. Die
# DDBgo-/DDBpro-Profile setzen es für kompatible Upgrades explizit.
nameOverride: ""

platform:
  # openshift erzeugt Route, ImageStreams und Image-Change-Trigger. kubernetes
  # erzeugt stattdessen ein networking.k8s.io/v1 Ingress. Für Kubernetes sollte
  # zusätzlich values-kubernetes.yaml verwendet werden.
  type: openshift

# Alle Ressourcennamen werden aus dem Helm-Release-Namen abgeleitet.
naming:
  # Für wiederverwendbare Installationen dürfen Release- und Namespace-Name
  # voneinander abweichen. Die fest benannten DDB-Profile aktivieren den Schutz.
  enforceReleaseNamespaceMatch: false
  # Optional kann die Installation auf bekannte Release-Namen begrenzt werden.
  # Leer erlaubt die Wiederverwendung für beliebige Webseiten.
  allowedReleaseNames: []

# Zusätzliche Annotationen für alle vom Chart erzeugten Kubernetes- und
# OpenShift-Ressourcen. Werte können je Umgebung überschrieben und weitere
# Annotationen ergänzt werden; leere Strings werden ausgelassen.
# Helm-Owner-Annotationen und resource-policy verwaltet das Chart selbst.
commonAnnotations: {}

# Schutz vorhandener Ressourcen.
protection:
  # Bricht ab, wenn bei der Erstinstallation gleichnamige Ressourcen existieren.
  # Bei Upgrades werden nur Ressourcen mit passenden Helm-Owner-Annotationen
  # verändert.
  failOnExistingResource: true

verticalPodAutoscaler:
  # Erzeugt je einen VPA für Drupal, Redis und MariaDB. Voraussetzung ist, dass
  # der Vertical Pod Autoscaler Operator samt CRD im Cluster installiert ist.
  # Standardmäßig aus, damit eine Installation keine optionale CRD voraussetzt.
  enabled: false
  # Off sammelt ausschließlich Empfehlungen und verändert keine Pods.
  updateMode: "Off"
  # CPU und Arbeitsspeicher werden in den Empfehlungen berücksichtigt.
  controlledResources:
    - cpu
    - memory
  # Empfehlungen enthalten Requests und proportional angepasste Limits.
  controlledValues: RequestsAndLimits

# Optionale Registry-Secrets für alle Pods, z. B.:
# imagePullSecrets:
#   - name: ghcr-pull-secret
imagePullSecrets: []

serviceAccounts:
  # false: Das Chart legt keine ServiceAccounts an. Dann müssen Accounts mit
  # den unten angegebenen oder den automatisch abgeleiteten Namen existieren.
  create: true
  # Zusätzliche Annotationen für alle vom Chart erzeugten ServiceAccounts.
  annotations: {}
  # Leere Werte erzeugen <release>-drupal, <release>-redis und <release>-db.
  drupalName: ""
  redisName: ""
  databaseName: ""

drupal:
  # Zentrale öffentliche Domain. Route-Name/-Host und Trusted-Host-Regel werden
  # daraus abgeleitet. Die internen Health-Probes verwenden diese Domain nicht.
  # Absichtlich nicht auflösbarer Platzhalter. In der OpenShift Form View oder
  # per Values-Datei durch den öffentlichen DNS-Namen der Website ersetzen.
  externalHost: change-me.example.invalid
  # Recreate verhindert, dass während eines Rollouts zwei Drupal-Pods zugleich
  # Änderungen am gemeinsam verwendeten Dateispeicher durchführen.
  replicaCount: 1
  image:
    # Austauschbares Drupal-Anwendungsimage. Es muss den in README.md
    # dokumentierten Containervertrag erfüllen.
    # Lauffähiger Referenzwert; Website-Profile überschreiben ihn explizit.
    repository: ghcr.io/mbuechner/ddbgo
    tag: tagged
    # Always ist bei beweglichen Tags möglich; der ImageStream-Trigger setzt
    # beim Rollout normalerweise eine eindeutige Digest-Referenz ein.
    pullPolicy: IfNotPresent
    autoUpdate:
      # Erzeugt einen ImageStream und einen Image-Change-Trigger. Eine Änderung
      # des importierten Digests startet automatisch ein neues Deployment.
      enabled: true
      # true: OpenShift prüft das externe Repository regelmäßig. false: Import
      # nur manuell, z. B. mit `oc import-image <release>-drupal -n <namespace>`.
      scheduledImport: true
  service:
    # Interner Service-Port und gleichzeitig Zielport der OpenShift Route.
    port: 8080
  route:
    # Wird ausschließlich mit platform.type=openshift ausgewertet.
    enabled: true
    annotations:
      # Vorhandene Forwarded-Header des externen Reverse Proxys beibehalten.
      haproxy.router.openshift.io/set-forwarded-headers: if-none
    # Kein TLS in der Route: HTTPS endet am vorgeschalteten Reverse Proxy.
  ingress:
    # Wird ausschließlich mit platform.type=kubernetes ausgewertet. Das Ingress
    # enthält wie die OpenShift Route bewusst keinen TLS-Block.
    enabled: true
    # Leer verwendet die Standard-IngressClass des Clusters.
    className: ""
    annotations: {}
    path: /
    pathType: Prefix
  config:
    # Absoluter Webroot im austauschbaren Drupal-Container.
    webRoot: /var/www/html/web
    # Wird als UPDATE_FREE_ACCESS an den kompatiblen Drupal-Container übergeben.
    updateFreeAccess: false
    # Relativ zu /var/www/html/web; der PVC-Unterordner data/public wird dort
    # eingebunden.
    filePublicPath: sites/default/files
    # Absolut und außerhalb des Webroots; verwendet PVC-Unterordner data/private.
    filePrivatePath: /var/www/html/private
    # Temporäres emptyDir; keine persistenten Daten dort ablegen.
    tempPath: /tmp
    # TRUSTED_HOST_PATTERNS wird aus localhost, drupal.externalHost und dem
    # Drupal-Ressourcennamen erzeugt. Alle Werte werden automatisch als exakte
    # reguläre Ausdrücke escaped.
    trustedHosts:
      allowLocalhost: true
      # Zusätzliche literale Hostnamen; keine regulären Ausdrücke eintragen.
      additionalHosts: []
    # Lokaler Request-Kontext für Drush. Drush benötigt dadurch weder DNS noch
    # Reverse Proxy oder OpenShift Route.
    drushOptionsUri: http://localhost:8080
  env:
    # Exakte Werte der gleichnamigen Container-Umgebungsvariablen. "yes" führt
    # die jeweilige zustandsändernde Drush-Aktion bei jedem Containerstart aus.
    UPDATEDB_ON_STARTUP: "no"
    CONFIG_IMPORT_ON_STARTUP: "no"
    CACHEREBUILD_ON_STARTUP: "no"
    # Leere Werte bedeuten <unset>. HTTP Basic Auth wird nur aktiviert, wenn
    # HTPASSWD_USER und HTPASSWD_PWD gemeinsam gesetzt sind oder existingSecret
    # verwendet wird. Das Passwort nicht in öffentliche Values-Dateien eintragen.
    HTPASSWD_GREETING: ""
    HTPASSWD_USER: ""
    HTPASSWD_PWD: ""
  basicAuth:
    # Optionales extern verwaltetes Secret mit den Schlüsseln HTPASSWD_USER und
    # HTPASSWD_PWD. Bei Verwendung müssen die beiden direkten Values leer sein.
    # Ohne existingSecret erzeugt das Chart bei gesetzten direkten Values das
    # behaltene Secret <release>-drupal-http-auth.
    existingSecret: ""
  dependencyChecks:
    # Init-Container lassen Drupal erst starten, wenn ein authentifiziertes
    # SELECT 1 gegen MariaDB und – sofern aktiviert – Redis PING erfolgreich sind.
    retryIntervalSeconds: 5
    # Kleine, nur während des Pod-Starts benötigte Ressourcen für beide Checks.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  probes:
    # Nicht gecachter Drupal-Endpunkt. Kubernetes verbindet direkt mit Port 8080
    # des Pods; weder Route noch öffentliches DNS oder Reverse Proxy sind beteiligt.
    # Bei aktivierter HTTP Basic Auth verwenden alle drei Probes automatisch die
    # Zugangsdaten aus dem HTTP-Auth-Secret für einen lokalen curl-Aufruf.
    path: /health
    # HTTP-Host-Header für den lokalen Request. Nicht auf externalHost setzen:
    # localhost ist bereits Bestandteil der automatisch erzeugten Trusted Hosts.
    hostHeader: localhost
    startup:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 30
    readiness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 3
  secret:
    # true erzeugt das Secret <release>-drupal. Bei false muss existingSecret
    # gesetzt sein und den Schlüssel "hash-salt" enthalten. Erzeugte Secrets
    # bleiben bei helm uninstall erhalten und werden erneut übernommen.
    create: true
    existingSecret: ""
    # Leer: Bei der Erstinstallation zufällig erzeugen und bei Upgrades behalten.
    hashSalt: ""
  persistence:
    # true erzeugt den PVC <release>-drupal. Bei false muss existingClaim gesetzt
    # sein.
    create: true
    # true behält den erzeugten PVC bei helm uninstall. Eine Neuinstallation mit
    # demselben Release und Namespace übernimmt diesen PVC wieder.
    retain: true
    existingClaim: ""
    # ReadWriteOnce funktioniert mit den üblichen Standard-StorageClasses. Bei
    # replicaCount > 1 ist eine RWX-fähige StorageClass erforderlich und der
    # Wert muss auf ReadWriteMany geändert werden.
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    # Leer verwendet die Standard-StorageClass des Clusters.
    storageClass: ""
  # Zusätzliche Annotationen am Pod-Template, nicht am Deployment selbst.
  podAnnotations: {}
  # Keine feste UID/GID setzen: OpenShift weist sie über die SCC zu.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    # Restriktiver Container-Kontext, kompatibel mit der OpenShift restricted SCC.
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
  resources:
    # Sparsame Standardwerte; für Last und Datenmenge produktiv bemessen.
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

redis:
  # false deaktiviert Redis-Workload, Service, Secret, PVC und Image-Trigger.
  enabled: true
  # Das StatefulSet prüft Startup, Readiness und Liveness mit `redis-cli ping`.
  # REDISCLI_AUTH wird dabei aus dem Redis-Secret bezogen.
  image:
    repository: docker.io/library/redis
    # Beweglicher Patch-Tag innerhalb der Redis-8.2-LTS-Linie.
    tag: 8.2-alpine
    pullPolicy: Always
    autoUpdate:
      # Erstellt <release>-redis als ImageStream und versieht das StatefulSet mit
      # einem Image-Change-Trigger.
      enabled: true
      # Regelmäßigen Import des oben angegebenen externen Tags aktivieren.
      scheduledImport: true
  secret:
    # Bei create=false muss existingSecret den Schlüssel "password" enthalten.
    # Die Redis-ACL wird bei jedem Podstart daraus erzeugt, sodass Passwort und
    # ACL nicht auseinanderlaufen können. Erzeugte Secrets bleiben bei
    # helm uninstall erhalten und werden erneut übernommen.
    create: true
    existingSecret: ""
    # Leer: Einmalig erzeugen. Ein gesetztes Passwort muss 16-128 Zeichen aus
    # A-Z, a-z und 0-9 enthalten, damit die generierte Redis-ACL sicher bleibt.
    password: ""
  persistence:
    # Der PVC wird als /data mit subPath "data" eingebunden. Redis nutzt AOF.
    create: true
    # true behält den erzeugten PVC bei helm uninstall und erlaubt seine erneute
    # Übernahme durch denselben Release-Namen im selben Namespace.
    retain: true
    existingClaim: ""
    # Redis besitzt hier genau eine Replik; ReadWriteOnce vermeidet eine
    # unnötige Abhängigkeit von einer RWX-fähigen StorageClass.
    accessModes:
      - ReadWriteOnce
    size: 2Gi
    # Leer verwendet die Standard-StorageClass des Clusters.
    storageClass: ""
  podAnnotations: {}
  # Keine feste UID/GID setzen; OpenShift bestimmt diese über die SCC.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    # Gilt für Init- und Hauptcontainer.
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
  resources:
    # Sparsame Ausgangswerte; insbesondere memory an Cachegröße/Last anpassen.
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

database:
  # MariaDB ist für die unterstützten Drupal-Images erforderlich; false wird
  # vom Chart bewusst abgelehnt.
  enabled: true
  # Startup und Readiness verwenden `healthcheck.sh --connect
  # --innodb_initialized`; Liveness prüft mit `healthcheck.sh --connect`.
  config:
    # Globaler Standard für alle neu aufgebauten Datenbankverbindungen.
    # MariaDB erwartet die Schreibweise mit Bindestrich.
    transactionIsolation: READ-COMMITTED
  image:
    repository: docker.io/library/mariadb
    # Beweglicher Patch-Tag innerhalb der MariaDB-11.8-LTS-Linie. Das UBI9-Image
    # ist für den Betrieb mit OpenShift geeignet.
    tag: 11.8-ubi9
    pullPolicy: Always
    autoUpdate:
      # Erstellt <release>-db als ImageStream und versieht das StatefulSet mit
      # einem Image-Change-Trigger.
      enabled: true
      # Regelmäßigen Import des oben angegebenen externen Tags aktivieren.
      scheduledImport: true
  auth:
    # Bei create=false muss existingSecret die Schlüssel "database", "username",
    # "password" und "root-password" enthalten. Erzeugte Secrets bleiben bei
    # helm uninstall erhalten und werden erneut übernommen.
    create: true
    existingSecret: ""
    database: drupal
    username: drupal
    # Bei einer frischen Datenbank werden leere Passwörter einmalig erzeugt und
    # bei Upgrades weiterverwendet. Bei einem behaltenen MariaDB-PVC ohne altes
    # Secret sind die ursprünglichen Werte oder existingSecret verpflichtend.
    password: ""
    rootPassword: ""
  persistence:
    # Der PVC wird als /var/lib/mysql mit subPath "data" eingebunden.
    create: true
    # true behält den erzeugten PVC bei helm uninstall und erlaubt seine erneute
    # Übernahme durch denselben Release-Namen im selben Namespace.
    retain: true
    existingClaim: ""
    # MariaDB besitzt hier genau eine Replik; ReadWriteOnce vermeidet eine
    # unnötige Abhängigkeit von einer RWX-fähigen StorageClass.
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    # Leer verwendet die Standard-StorageClass des Clusters.
    storageClass: ""
  podAnnotations: {}
  # Keine feste UID/GID setzen; /run/mariadb und /tmp sind beschreibbare
  # emptyDirs, während OpenShift die Laufzeit-UID über die SCC vergibt.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    # Gilt für Init- und Hauptcontainer.
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
  resources:
    # Sparsame Ausgangswerte; für produktive Datenmengen gezielt erhöhen.
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
