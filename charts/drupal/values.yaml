# Wiederverwendbare Drupal-Umgebung für Kubernetes und OpenShift.
# Website-spezifische Einstellungen stehen in values-*.yaml.

# Optionaler Wert für app.kubernetes.io/name. Ressourcennamen werden weiterhin
# ausschließlich aus dem Helm-Release-Namen abgeleitet.
nameOverride: ""

platform:
  # openshift erzeugt Route, ImageStreams und Image-Change-Trigger. kubernetes
  # erzeugt stattdessen ein networking.k8s.io/v1 Ingress. Für Kubernetes sollte
  # zusätzlich values-kubernetes.yaml verwendet werden.
  type: openshift

# Alle Ressourcen- und Container-Namen werden aus dem Helm-Release-Namen
# abgeleitet. Release und Namespace müssen deshalb übereinstimmen. Die
# Hauptcontainer heißen <release>-drupal, <release>-redis und <release>-db.

# Zusätzliche Annotationen für alle vom Chart erzeugten Kubernetes- und
# OpenShift-Ressourcen. Werte können je Umgebung überschrieben und weitere
# Annotationen ergänzt werden; leere Strings werden ausgelassen.
# Helm-Owner-Annotationen und resource-policy verwaltet das Chart selbst.
commonAnnotations:
  dnb.contact/emails: m.buechner@dnb.de
  dnb.contact/persons: Michael Büchner

verticalPodAutoscaler:
  # Erzeugt je einen VPA für Drupal, Redis und MariaDB. Voraussetzung ist, dass
  # der Vertical Pod Autoscaler Operator samt CRD im Cluster installiert ist.
  # OpenShift-Standard. values-kubernetes.yaml deaktiviert VPA, weil die CRD
  # dort nicht vorausgesetzt werden kann.
  enabled: true
  # Off sammelt ausschließlich Empfehlungen und verändert keine Pods.
  updateMode: "Off"
  # Empfehlungen enthalten Requests und proportional angepasste Limits.
  controlledValues: RequestsAndLimits

# Die kurzlebigen Init-Container legen lediglich Verzeichnisse und kleine
# Konfigurationsdateien auf den Volumes an. Explizite Requests verhindern, dass
# eine Namespace-LimitRange dafür unverhältnismäßig große Defaults einsetzt.
storagePreparationResources:
  requests:
    cpu: 5m
    memory: 16Mi
  limits:
    cpu: 50m
    memory: 64Mi

serviceAccounts:
  # false: Das Chart legt keine ServiceAccounts an. Dann müssen Accounts mit
  # den unten angegebenen oder den automatisch abgeleiteten Namen existieren.
  create: true
  # Zusätzliche Annotationen für alle vom Chart erzeugten ServiceAccounts.
  annotations: {}
  # Leere Werte erzeugen <release>-drupal, <release>-redis und <release>-db.
  drupalName: ""
  redisName: ""
  databaseName: ""

drupal:
  # Domain für Route/Ingress, Trusted-Host-Regel und SMTP-Client. Die internen
  # Health-Probes verwenden die öffentliche Domain nicht.
  externalHost: change-me.example.invalid
  # Recreate verhindert, dass während eines Rollouts zwei Drupal-Pods zugleich
  # Änderungen am gemeinsam verwendeten Dateispeicher durchführen.
  replicaCount: 1
  image:
    # Austauschbares Drupal-Anwendungsimage. Es muss den im Deployment-Template
    # abgebildeten Containervertrag erfüllen.
    repository: ghcr.io/mbuechner/ddbgo
    tag: tagged
    # Die unterstützten Tags sind beweglich. OpenShift setzt beim automatischen
    # Rollout normalerweise zusätzlich eine eindeutige Digest-Referenz ein.
    pullPolicy: Always
    autoUpdate:
      # Erzeugt einen ImageStream und einen Image-Change-Trigger. Eine Änderung
      # des importierten Digests startet automatisch ein neues Deployment.
      enabled: true
      # true: OpenShift prüft das externe Repository regelmäßig. false: Import
      # nur manuell, z. B. mit `oc import-image <release>-drupal -n <namespace>`.
      scheduledImport: true
  service:
    # Interner Service-Port und gleichzeitig Zielport der OpenShift Route.
    port: 8080
  route:
    # Wird ausschließlich mit platform.type=openshift ausgewertet.
    enabled: true
    annotations:
      # Vorhandene Forwarded-Header des externen Reverse Proxys beibehalten.
      haproxy.router.openshift.io/set-forwarded-headers: if-none
    # Kein TLS in der Route: HTTPS endet am vorgeschalteten Reverse Proxy.
  ingress:
    # Wird ausschließlich mit platform.type=kubernetes ausgewertet. Das Ingress
    # enthält wie die OpenShift Route bewusst keinen TLS-Block.
    enabled: true
    # Leer verwendet die Standard-IngressClass des Clusters.
    className: ""
    annotations: {}
    path: /
    pathType: Prefix
  config:
    # TRUSTED_HOST_PATTERNS enthält immer localhost und 127.0.0.1 und wird um
    # drupal.externalHost sowie den Drupal-Ressourcennamen ergänzt. Alle Werte
    # werden automatisch als exakte reguläre Ausdrücke escaped.
    trustedHosts:
      # Zusätzliche literale Hostnamen; keine regulären Ausdrücke eintragen.
      additionalHosts: []
  startup:
    # Führt die jeweilige zustandsändernde Drush-Aktion bei jedem
    # Containerstart aus. Das Chart erzeugt daraus die *_ON_STARTUP-Variablen.
    updateDatabase: false
    importConfig: false
    rebuildCache: false
  basicAuth:
    # Das Passwort wird bei der ersten Aktivierung generiert und ausschließlich
    # im chartverwalteten Secret gespeichert.
    enabled: false
    greeting: ""
    username: ""
  smtp:
    # Alle Werte werden unter ihren gleichnamigen SMTP_*-Variablen an den
    # Drupal-Container uebergeben. SMTP_PASSWORD wird ausschließlich direkt im
    # chartverwalteten Secret gepflegt und ist kein Helm-Value.
    enabled: false
    host: smtp.example.org
    hostBackup: smtp-backup.example.org
    port: 587
    protocol: tls
    autoTls: true
    timeout: 30
    username: noreply@example.org
    from: noreply@example.org
    fromName: DDBpro
    # SMTP_CLIENT_HOSTNAME und SMTP_CLIENT_HELO werden aus dem zentralen
    # öffentlichen Host erzeugt.
    allowHtml: true
    testAddress: developer@example.org
    # Leer lassen, sofern ausgehende E-Mails nicht umgeleitet werden sollen.
    rerouteAddress: ""
    debugging: false
    debugLevel: 1
    keepalive: false
  dependencyChecks:
    # Init-Container lassen Drupal erst starten, wenn ein authentifiziertes
    # SELECT 1 gegen MariaDB und Redis PING erfolgreich sind.
    retryIntervalSeconds: 5
    # Kleine, nur während des Pod-Starts benötigte Ressourcen für beide Checks.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  probes:
    # Nicht gecachter Drupal-Endpunkt. Kubernetes verbindet direkt mit Port 8080
    # des Pods; weder Route noch öffentliches DNS oder Reverse Proxy sind beteiligt.
    # Bei aktivierter HTTP Basic Auth verwenden alle drei Probes automatisch die
    # Zugangsdaten aus dem HTTP-Auth-Secret für einen lokalen curl-Aufruf.
    path: /health
    startup:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 30
    readiness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 3
  persistence:
    # true behält den erzeugten PVC bei helm uninstall. Eine Neuinstallation mit
    # demselben Release und Namespace übernimmt diesen PVC wieder.
    retain: true
    # Leer erzeugt <release>-drupal, sofern er noch nicht existiert. Ein Name
    # bindet stattdessen einen bereits vorhandenen PVC ein.
    existingClaim: ""
    # OpenShift verwendet gemeinsam nutzbaren Speicher. Kubernetes kann dies in
    # values-kubernetes.yaml für eine Einzelreplik auf ReadWriteOnce ändern.
    accessModes:
      - ReadWriteMany
    # Gilt ausschließlich bei der ersten Anlage. Bestehende PVCs werden nicht
    # automatisch vergrößert oder verkleinert.
    size: 10Gi
    # Leer verwendet die Standard-StorageClass des Clusters.
    storageClass: ""
  # Zusätzliche Annotationen am Pod-Template, nicht am Deployment selbst.
  podAnnotations: {}
  # Keine feste UID/GID setzen: OpenShift weist sie über die SCC zu.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    # Restriktiver Container-Kontext, kompatibel mit der OpenShift restricted SCC.
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
  resources:
    # Ausreichende Reserve für PHP, Drush und kurzzeitige Lastspitzen.
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

redis:
  # Redis ist ein fester Bestandteil des Charts. Das StatefulSet prüft Startup,
  # Readiness und Liveness mit `redis-cli ping`; REDISCLI_AUTH wird dabei aus
  # dem Redis-Secret bezogen.
  image:
    repository: docker.io/library/redis
    # Beweglicher Patch-Tag innerhalb der Redis-8.2-LTS-Linie.
    tag: 8.2-alpine
    pullPolicy: Always
    autoUpdate:
      # Erstellt <release>-redis als ImageStream und versieht das StatefulSet mit
      # einem Image-Change-Trigger.
      enabled: true
      # Regelmäßigen Import des oben angegebenen externen Tags aktivieren.
      scheduledImport: true
  persistence:
    # true behält den erzeugten PVC bei helm uninstall und erlaubt seine erneute
    # Übernahme durch denselben Release-Namen im selben Namespace.
    retain: true
    # Leer erzeugt <release>-redis, sofern er noch nicht existiert. Ein Name
    # bindet stattdessen einen bereits vorhandenen PVC ein.
    existingClaim: ""
    # OpenShift verwendet einheitlich gemeinsam nutzbaren Speicher.
    accessModes:
      - ReadWriteMany
    # Gilt ausschließlich bei der ersten Anlage. Bestehende PVCs werden nicht
    # automatisch vergrößert oder verkleinert.
    size: 2Gi
    # Leer verwendet die Standard-StorageClass des Clusters.
    storageClass: ""
  podAnnotations: {}
  # Keine feste UID/GID setzen; OpenShift bestimmt diese über die SCC.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    # Gilt für Init- und Hauptcontainer.
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
  resources:
    # maxmemory ist intern auf 768 MB begrenzt. Das deutlich höhere Limit lässt
    # Reserve für Redis-Module, Client-Puffer und Copy-on-write beim AOF-Rewrite.
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

database:
  # MariaDB ist fester Bestandteil des Charts und kann nicht deaktiviert werden.
  # Startup und Readiness verwenden `healthcheck.sh --connect
  # --innodb_initialized`; Liveness prüft mit `healthcheck.sh --connect`.
  config:
    # Globaler Standard für alle neu aufgebauten Datenbankverbindungen.
    # MariaDB erwartet die Schreibweise mit Bindestrich.
    transactionIsolation: READ-COMMITTED
  image:
    repository: docker.io/library/mariadb
    # Beweglicher Patch-Tag innerhalb der MariaDB-11.8-LTS-Linie. Das UBI9-Image
    # ist für den Betrieb mit OpenShift geeignet.
    tag: 11.8-ubi9
    pullPolicy: Always
    autoUpdate:
      # Erstellt <release>-db als ImageStream und versieht das StatefulSet mit
      # einem Image-Change-Trigger.
      enabled: true
      # Regelmäßigen Import des oben angegebenen externen Tags aktivieren.
      scheduledImport: true
  persistence:
    # true behält den erzeugten PVC bei helm uninstall und erlaubt seine erneute
    # Übernahme durch denselben Release-Namen im selben Namespace.
    retain: true
    # Leer erzeugt <release>-db, sofern er noch nicht existiert. Ein Name bindet
    # stattdessen einen bereits vorhandenen PVC ein.
    existingClaim: ""
    # OpenShift verwendet einheitlich gemeinsam nutzbaren Speicher.
    accessModes:
      - ReadWriteMany
    # Gilt ausschließlich bei der ersten Anlage. Bestehende PVCs werden nicht
    # automatisch vergrößert oder verkleinert.
    size: 5Gi
    # Leer verwendet die Standard-StorageClass des Clusters.
    storageClass: ""
  podAnnotations: {}
  # Keine feste UID/GID setzen; /run/mariadb und /tmp sind beschreibbare
  # emptyDirs, während OpenShift die Laufzeit-UID über die SCC vergibt.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    # Gilt für Init- und Hauptcontainer.
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
  resources:
    # Reserve für Buffer Pool, Verbindungen und Wartungsoperationen.
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
