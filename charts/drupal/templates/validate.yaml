{{- if ne .Release.Name .Release.Namespace }}
{{- fail (printf "release name %q must match namespace %q" .Release.Name .Release.Namespace) }}
{{- end }}
{{- if not (has .Values.platform.type (list "openshift" "kubernetes")) }}
{{- fail "platform.type must be openshift or kubernetes" }}
{{- end }}
{{- if and (eq .Values.platform.type "kubernetes") (not (hasPrefix "/" .Values.drupal.ingress.path)) }}
{{- fail "drupal.ingress.path must start with /" }}
{{- end }}
{{- if and (eq .Values.platform.type "kubernetes") (not (has .Values.drupal.ingress.pathType (list "Exact" "Prefix" "ImplementationSpecific"))) }}
{{- fail "drupal.ingress.pathType must be Exact, Prefix or ImplementationSpecific" }}
{{- end }}
{{- $commonAnnotations := .Values.commonAnnotations | default dict -}}
{{- if or (hasKey $commonAnnotations "meta.helm.sh/release-name") (hasKey $commonAnnotations "meta.helm.sh/release-namespace") (hasKey $commonAnnotations "helm.sh/resource-policy") }}
{{- fail "commonAnnotations must not override Helm ownership or resource-policy annotations" }}
{{- end }}
{{- if lt (int .Values.drupal.dependencyChecks.retryIntervalSeconds) 1 }}
{{- fail "drupal.dependencyChecks.retryIntervalSeconds must be at least 1" }}
{{- end }}
{{- if not .Values.drupal.image.repository }}
{{- fail "drupal.image.repository must not be empty" }}
{{- end }}
{{- if not .Values.drupal.image.tag }}
{{- fail "drupal.image.tag must not be empty" }}
{{- end }}
{{- if and (eq .Values.platform.type "kubernetes") (eq .Values.redis.image.repository "docker.io/library/redis") (not (hasKey .Values.redis.podSecurityContext "runAsUser")) }}
{{- fail "redis.podSecurityContext.runAsUser must be set for the official Redis image on Kubernetes; load values-kubernetes.yaml after the environment values file" }}
{{- end }}
{{- if not (has .Values.verticalPodAutoscaler.updateMode (list "Off" "Initial" "Recreate" "InPlaceOrRecreate" "InPlace" "Auto")) }}
{{- fail "verticalPodAutoscaler.updateMode must be one of Off, Initial, Recreate, InPlaceOrRecreate, InPlace or Auto" }}
{{- end }}
{{- if not (has .Values.verticalPodAutoscaler.controlledValues (list "RequestsAndLimits" "RequestsOnly")) }}
{{- fail "verticalPodAutoscaler.controlledValues must be RequestsAndLimits or RequestsOnly" }}
{{- end }}
{{- if and .Values.drupal.basicAuth.enabled (not .Values.drupal.basicAuth.username) }}
{{- fail "drupal.basicAuth.username is required when HTTP Basic Auth is enabled" }}
{{- end }}
{{- if and .Values.drupal.smtp.enabled (not .Values.drupal.smtp.host) }}
{{- fail "drupal.smtp.host is required when SMTP is enabled" }}
{{- end }}
{{- if not (has .Values.database.config.transactionIsolation (list "READ-UNCOMMITTED" "READ-COMMITTED" "REPEATABLE-READ" "SERIALIZABLE")) }}
{{- fail "database.config.transactionIsolation must be one of READ-UNCOMMITTED, READ-COMMITTED, REPEATABLE-READ or SERIALIZABLE" }}
{{- end }}
{{- $persistentComponents := list
      (dict "component" "drupal" "name" (include "drupal.drupalClaimName" .) "requiresReadWriteMany" (gt (int .Values.drupal.replicaCount) 1) "persistence" .Values.drupal.persistence)
      (dict "component" "redis" "name" (include "drupal.redisClaimName" .) "requiresReadWriteMany" false "persistence" .Values.redis.persistence)
      (dict "component" "database" "name" (include "drupal.databaseClaimName" .) "requiresReadWriteMany" false "persistence" .Values.database.persistence) -}}
{{- range $item := $persistentComponents }}
  {{- if eq (len $item.persistence.accessModes) 0 }}
    {{- fail (printf "%s.persistence.accessModes must contain at least one access mode" $item.component) -}}
  {{- end }}
  {{- if and $item.requiresReadWriteMany (not (has "ReadWriteMany" $item.persistence.accessModes)) }}
    {{- fail (printf "%s.persistence.accessModes must contain ReadWriteMany when more than one Drupal replica is configured" $item.component) -}}
  {{- end }}
  {{- $existingClaim := lookup "v1" "PersistentVolumeClaim" $.Release.Namespace $item.name -}}
  {{- if $existingClaim }}
    {{- $existingAccessModes := dig "spec" "accessModes" (list) $existingClaim -}}
    {{- if and $item.requiresReadWriteMany (not (has "ReadWriteMany" $existingAccessModes)) }}
      {{- fail (printf "PersistentVolumeClaim %s/%s does not provide required ReadWriteMany access; migrate its data to an RWX-capable volume before installing or upgrading" $.Release.Namespace $item.name) -}}
    {{- end }}
    {{- if and (eq $item.component "database") $.Release.IsInstall -}}
      {{- $databaseSecretName := include "drupal.databaseSecretName" $ -}}
      {{- $existingDatabaseSecret := lookup "v1" "Secret" $.Release.Namespace $databaseSecretName -}}
      {{- if not $existingDatabaseSecret -}}
        {{- fail (printf "retained MariaDB PVC %s/%s exists but its chart-managed Secret %s is missing; restore that Secret before reinstalling" $.Release.Namespace $item.name $databaseSecretName) -}}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if not .Values.drupal.externalHost }}
{{- fail "drupal.externalHost must not be empty because it defines the Route or Ingress and trusted host" }}
{{- end }}
{{- if not (hasPrefix "/" .Values.drupal.probes.path) }}
{{- fail "drupal.probes.path must start with /" }}
{{- end }}
