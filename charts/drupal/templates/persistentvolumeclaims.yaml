{{- $claims := list
      (dict "existing" .Values.drupal.persistence.existingClaim "name" (include "drupal.drupalName" .) "component" "drupal" "persistence" .Values.drupal.persistence)
      (dict "existing" .Values.redis.persistence.existingClaim "name" (include "drupal.redisName" .) "component" "redis" "persistence" .Values.redis.persistence)
      (dict "existing" .Values.database.persistence.existingClaim "name" (include "drupal.databaseName" .) "component" "db" "persistence" .Values.database.persistence) -}}
{{- range $claim := $claims }}
{{- if not $claim.existing }}
{{- $currentClaim := lookup "v1" "PersistentVolumeClaim" $.Release.Namespace $claim.name }}
{{- include "drupal.assertAvailable" (dict "root" $ "apiVersion" "v1" "kind" "PersistentVolumeClaim" "name" $claim.name "allowAdoption" true) }}
{{- if not $currentClaim }}
{{- /*
Only render a missing PVC. An existing, release-owned PVC is mounted by its
stable name without reconciling size, access modes or StorageClass.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claim.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "drupal.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $claim.component }}
  annotations:
    {{- include "drupal.protectionAnnotations" $ | nindent 4 }}
    {{- if $claim.persistence.retain }}
    helm.sh/resource-policy: keep
    {{- end }}
spec:
  accessModes:
    {{- toYaml $claim.persistence.accessModes | nindent 4 }}
  {{- with $claim.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $claim.persistence.size }}
---
{{- end }}
{{- end }}
{{- end }}
