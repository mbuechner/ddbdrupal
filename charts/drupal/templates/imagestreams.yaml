{{- if eq .Values.platform.type "openshift" }}
{{- $drupalImage := dict
      "repository" .Values.drupal.image.repository
      "tag" .Values.drupal.image.tag
      "autoUpdate" .Values.drupal.image.autoUpdate -}}
{{- $components := list
  (dict "enabled" true "component" "drupal" "name" (include "drupal.drupalName" .) "image" $drupalImage)
  (dict "enabled" true "component" "redis" "name" (include "drupal.redisName" .) "image" .Values.redis.image)
  (dict "enabled" true "component" "db" "name" (include "drupal.databaseName" .) "image" .Values.database.image)
-}}
{{- range $component := $components }}
{{- if and $component.enabled $component.image.autoUpdate.enabled }}
{{- include "drupal.assertAvailable" (dict "root" $ "apiVersion" "image.openshift.io/v1" "kind" "ImageStream" "name" $component.name) }}
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: {{ $component.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "drupal.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component.component }}
  annotations:
    {{- include "drupal.protectionAnnotations" $ | nindent 4 }}
spec:
  lookupPolicy:
    local: false
  tags:
    - name: {{ $component.image.tag | quote }}
      from:
        kind: DockerImage
        name: {{ printf "%s:%s" $component.image.repository $component.image.tag | quote }}
      importPolicy:
        scheduled: {{ $component.image.autoUpdate.scheduledImport }}
        importMode: {{ $component.image.autoUpdate.importMode }}
      referencePolicy:
        type: Source
{{- end }}
{{- end }}
{{- end }}
