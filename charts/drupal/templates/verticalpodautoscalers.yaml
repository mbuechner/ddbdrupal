{{- if .Values.verticalPodAutoscaler.enabled }}
{{- $workloads := list
      (dict "enabled" true "name" (include "drupal.drupalName" .) "component" "drupal" "kind" "Deployment")
      (dict "enabled" true "name" (include "drupal.redisName" .) "component" "redis" "kind" "StatefulSet")
      (dict "enabled" true "name" (include "drupal.databaseName" .) "component" "db" "kind" "StatefulSet") -}}
{{- range $workload := $workloads }}
{{- if $workload.enabled }}
{{- include "drupal.assertAvailable" (dict "root" $ "apiVersion" "autoscaling.k8s.io/v1" "kind" "VerticalPodAutoscaler" "name" $workload.name) }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ $workload.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "drupal.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $workload.component }}
  annotations:
    {{- include "drupal.protectionAnnotations" $ | nindent 4 }}
spec:
  resourcePolicy:
    containerPolicies:
      - containerName: {{ $workload.name }}
        controlledResources:
          - cpu
          - memory
        controlledValues: {{ $.Values.verticalPodAutoscaler.controlledValues }}
  targetRef:
    apiVersion: apps/v1
    kind: {{ $workload.kind }}
    name: {{ $workload.name }}
  updatePolicy:
    updateMode: {{ $.Values.verticalPodAutoscaler.updateMode | quote }}
---
{{- end }}
{{- end }}
{{- end }}
