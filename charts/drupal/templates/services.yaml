{{- $services := list
      (dict "enabled" true "name" (include "drupal.drupalName" .) "component" "drupal" "port" .Values.drupal.service.port "targetPort" "http")
      (dict "enabled" .Values.redis.enabled "name" (include "drupal.redisName" .) "component" "redis" "port" 6379 "targetPort" "redis")
      (dict "enabled" .Values.database.enabled "name" (include "drupal.databaseName" .) "component" "db" "port" 3306 "targetPort" "mysql") -}}
{{- range $service := $services }}
{{- if $service.enabled }}
{{- include "drupal.assertAvailable" (dict "root" $ "apiVersion" "v1" "kind" "Service" "name" $service.name) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $service.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "drupal.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service.component }}
  annotations:
    {{- include "drupal.protectionAnnotations" $ | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: {{ $service.targetPort }}
      port: {{ $service.port }}
      targetPort: {{ $service.targetPort }}
      protocol: TCP
  selector:
    {{- include "drupal.selectorLabels" (dict "root" $ "component" $service.component) | nindent 4 }}
---
{{- end }}
{{- end }}
