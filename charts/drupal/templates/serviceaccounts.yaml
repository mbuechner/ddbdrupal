{{- if .Values.serviceAccounts.create }}
{{- $components := list
      (dict "name" (include "drupal.drupalServiceAccountName" .) "component" "drupal")
      (dict "name" (include "drupal.redisServiceAccountName" .) "component" "redis")
      (dict "name" (include "drupal.databaseServiceAccountName" .) "component" "db") -}}
{{- range $index, $item := $components }}
{{- if or (eq $item.component "drupal") (eq $item.component "db") (and (eq $item.component "redis") $.Values.redis.enabled) }}
{{- include "drupal.assertAvailable" (dict "root" $ "apiVersion" "v1" "kind" "ServiceAccount" "name" $item.name) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $item.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "drupal.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $item.component }}
  annotations:
    {{- include "drupal.protectionAnnotations" $ | nindent 4 }}
    {{- with $.Values.serviceAccounts.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
---
{{- end }}
{{- end }}
{{- end }}
