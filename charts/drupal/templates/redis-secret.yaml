{{- $name := include "drupal.redisName" . -}}
{{- include "drupal.assertAvailable" (dict "root" . "apiVersion" "v1" "kind" "Secret" "name" $name "allowAdoption" true) }}
{{- $passwordPlain := randAlphaNum 48 -}}
{{- $password := $passwordPlain | b64enc -}}
{{- $legacyAcl := "" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if $existing -}}
  {{- $password = (get (default (dict) $existing.data) "password") | default $password -}}
  {{- $legacyAcl = (get (default (dict) $existing.data) "users.acl") | default "" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drupal.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  annotations:
    {{- include "drupal.protectionAnnotations" . | nindent 4 }}
    helm.sh/resource-policy: keep
type: Opaque
immutable: true
data:
  password: {{ $password | quote }}
  {{- if $legacyAcl }}
  # Preserve an existing legacy key so immutable retained Secrets are unchanged.
  # New Redis Pods derive their runtime ACL solely from password.
  users.acl: {{ $legacyAcl | quote }}
  {{- end }}
{{- end }}
