{{- $name := include "drupal.drupalSecretName" . -}}
{{- include "drupal.assertAvailable" (dict "root" . "apiVersion" "v1" "kind" "Secret" "name" $name "allowAdoption" true) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := deepCopy (default (dict) (and $existing $existing.data)) -}}
{{- if not (get $data "hash-salt") -}}
  {{- $_ := set $data "hash-salt" (randAlphaNum 64 | b64enc) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drupal.labels" . | nindent 4 }}
    app.kubernetes.io/component: drupal
  annotations:
    {{- include "drupal.protectionAnnotations" . | nindent 4 }}
    helm.sh/resource-policy: keep
type: Opaque
immutable: true
data:
  {{- toYaml $data | nindent 2 }}
