{{- if and .Values.drupal.basicAuth.username .Values.drupal.basicAuth.password }}
{{- $name := include "drupal.httpAuthSecretName" . -}}
{{- include "drupal.assertAvailable" (dict "root" . "apiVersion" "v1" "kind" "Secret" "name" $name "allowAdoption" true) }}
{{- $username := .Values.drupal.basicAuth.username | b64enc -}}
{{- $password := .Values.drupal.basicAuth.password | b64enc -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drupal.labels" . | nindent 4 }}
    app.kubernetes.io/component: drupal
  annotations:
    {{- include "drupal.protectionAnnotations" . | nindent 4 }}
    helm.sh/resource-policy: keep
type: Opaque
data:
  HTPASSWD_USER: {{ $username | quote }}
  HTPASSWD_PWD: {{ $password | quote }}
{{- end }}
