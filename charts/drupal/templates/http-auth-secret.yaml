{{- if .Values.drupal.basicAuth.enabled }}
{{- $name := include "drupal.httpAuthSecretName" . -}}
{{- include "drupal.assertAvailable" (dict "root" . "apiVersion" "v1" "kind" "Secret" "name" $name "allowAdoption" true) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := deepCopy (default (dict) (and $existing $existing.data)) -}}
{{- $_ := set $data "HTPASSWD_USER" (.Values.drupal.basicAuth.username | b64enc) -}}
{{- if not (get $data "HTPASSWD_PWD") -}}
  {{- $_ := set $data "HTPASSWD_PWD" (randAlphaNum 32 | b64enc) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drupal.labels" . | nindent 4 }}
    app.kubernetes.io/component: drupal
  annotations:
    {{- include "drupal.protectionAnnotations" . | nindent 4 }}
    helm.sh/resource-policy: keep
type: Opaque
immutable: false
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}
