{{- $name := include "drupal.drupalName" . -}}
{{- include "drupal.assertAvailable" (dict "root" . "apiVersion" "apps/v1" "kind" "Deployment" "name" $name) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drupal.labels" . | nindent 4 }}
    app.kubernetes.io/component: drupal
  annotations:
    {{- include "drupal.protectionAnnotations" . | nindent 4 }}
    {{- if and (eq .Values.platform.type "openshift") .Values.drupal.image.autoUpdate.enabled }}
    image.openshift.io/triggers: {{ include "drupal.imageTrigger" (dict "root" . "name" $name "tag" (include "drupal.drupalImageTag" .) "container" $name) | quote }}
    {{- end }}
spec:
  replicas: {{ .Values.drupal.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "drupal.selectorLabels" (dict "root" . "component" "drupal") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "drupal.selectorLabels" (dict "root" . "component" "drupal") | nindent 8 }}
      annotations:
        drupal.de/chart-version: {{ .Chart.Version | quote }}
        checksum/config: {{ include (print $.Template.BasePath "/drupal-configmap.yaml") . | sha256sum }}
        checksum/basic-auth: {{ .Values.drupal.basicAuth | toJson | sha256sum }}
        checksum/smtp: {{ .Values.drupal.smtp | toJson | sha256sum }}
      {{- with .Values.drupal.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "drupal.drupalServiceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.drupal.podSecurityContext | nindent 8 }}
      initContainers:
        - name: {{ include "drupal.componentName" (dict "root" . "component" "wait-for-database") }}
          image: {{ printf "%s:%s" .Values.database.image.repository .Values.database.image.tag | quote }}
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              until mariadb \
                --protocol=TCP \
                --host="${MYSQL_HOST}" \
                --port="${MYSQL_PORT}" \
                --user="${MYSQL_USER}" \
                --password="${MYSQL_PASSWORD}" \
                --execute="SELECT 1" \
                "${MYSQL_DATABASE}" >/dev/null 2>&1; do
                echo "Waiting for MariaDB at ${MYSQL_HOST}:${MYSQL_PORT} ..."
                sleep "${WAIT_INTERVAL_SECONDS}"
              done
              echo "MariaDB accepts authenticated connections."
          env:
            - name: MYSQL_HOST
              value: {{ include "drupal.databaseName" . | quote }}
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "drupal.databaseSecretName" . }}
                  key: database
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "drupal.databaseSecretName" . }}
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "drupal.databaseSecretName" . }}
                  key: password
            - name: WAIT_INTERVAL_SECONDS
              value: {{ .Values.drupal.dependencyChecks.retryIntervalSeconds | quote }}
          securityContext:
            {{- toYaml .Values.database.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.drupal.dependencyChecks.resources | nindent 12 }}
        - name: {{ include "drupal.componentName" (dict "root" . "component" "wait-for-redis") }}
          image: {{ printf "%s:%s" .Values.redis.image.repository .Values.redis.image.tag | quote }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              while true; do
                REDIS_RESPONSE="$(redis-cli -h "${REDIS_HOST}" -p "${REDIS_PORT}" ping 2>&1)" || true
                if [ "${REDIS_RESPONSE}" = "PONG" ]; then
                  echo "Redis accepts authenticated connections."
                  break
                fi
                echo "Waiting for Redis at ${REDIS_HOST}:${REDIS_PORT}; response: ${REDIS_RESPONSE}"
                sleep "${WAIT_INTERVAL_SECONDS}"
              done
          env:
            - name: REDIS_HOST
              value: {{ include "drupal.redisName" . | quote }}
            - name: REDIS_PORT
              value: "6379"
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "drupal.redisSecretName" . }}
                  key: password
            - name: WAIT_INTERVAL_SECONDS
              value: {{ .Values.drupal.dependencyChecks.retryIntervalSeconds | quote }}
          securityContext:
            {{- toYaml .Values.redis.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.drupal.dependencyChecks.resources | nindent 12 }}
        - name: {{ include "drupal.componentName" (dict "root" . "component" "prepare-drupal-storage") }}
          image: {{ printf "%s:%s" (include "drupal.drupalImageRepository" .) (include "drupal.drupalImageTag" .) | quote }}
          imagePullPolicy: {{ .Values.drupal.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - mkdir -p /storage/data/public /storage/data/private
          securityContext:
            {{- toYaml .Values.drupal.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.storagePreparationResources | nindent 12 }}
          volumeMounts:
            - name: drupal-data
              mountPath: /storage
      containers:
        - name: {{ $name }}
          image: {{ printf "%s:%s" (include "drupal.drupalImageRepository" .) (include "drupal.drupalImageTag" .) | quote }}
          imagePullPolicy: {{ .Values.drupal.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.drupal.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ $name }}
          env:
            # Startup-Aktionen stehen bewusst direkt im Pod-Template. Eine
            # Änderung löst dadurch einen Rollout aus; ConfigMap-envFrom allein
            # würde erst bei einem anderweitig neu gestarteten Pod wirksam.
            - name: UPDATEDB_ON_STARTUP
              value: {{ ternary "yes" "no" .Values.drupal.startup.updateDatabase | quote }}
            - name: CONFIG_IMPORT_ON_STARTUP
              value: {{ ternary "yes" "no" .Values.drupal.startup.importConfig | quote }}
            - name: CACHEREBUILD_ON_STARTUP
              value: {{ ternary "yes" "no" .Values.drupal.startup.rebuildCache | quote }}
            - name: HASH_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ include "drupal.drupalSecretName" . }}
                  key: hash-salt
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "drupal.databaseSecretName" . }}
                  key: database
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "drupal.databaseSecretName" . }}
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "drupal.databaseSecretName" . }}
                  key: password
            {{- if eq (include "drupal.httpAuthEnabled" .) "true" }}
            - name: HTPASSWD_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "drupal.httpAuthSecretName" . }}
                  key: HTPASSWD_USER
            - name: HTPASSWD_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "drupal.httpAuthSecretName" . }}
                  key: HTPASSWD_PWD
            - name: DRUPAL_HEALTHCHECK_URL
              value: {{ printf "http://localhost:8080%s" .Values.drupal.probes.path | quote }}
            {{- end }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "drupal.redisSecretName" . }}
                  key: password
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "drupal.smtpSecretName" . }}
                  key: SMTP_PASSWORD
          startupProbe:
            {{- include "drupal.drupalProbeHandler" . | nindent 12 }}
            periodSeconds: {{ .Values.drupal.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.drupal.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.drupal.probes.startup.failureThreshold }}
          readinessProbe:
            {{- include "drupal.drupalProbeHandler" . | nindent 12 }}
            periodSeconds: {{ .Values.drupal.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.drupal.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.drupal.probes.readiness.failureThreshold }}
          livenessProbe:
            {{- include "drupal.drupalProbeHandler" . | nindent 12 }}
            periodSeconds: {{ .Values.drupal.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.drupal.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.drupal.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.drupal.resources | nindent 12 }}
          volumeMounts:
            - name: drupal-data
              mountPath: {{ include "drupal.drupalPublicFilesMountPath" . | quote }}
              subPath: data/public
            - name: drupal-data
              mountPath: "/var/www/html/private"
              subPath: data/private
            - name: tmp
              mountPath: "/tmp"
      volumes:
        - name: drupal-data
          persistentVolumeClaim:
            claimName: {{ include "drupal.drupalClaimName" . }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.drupal.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.drupal.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.drupal.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
