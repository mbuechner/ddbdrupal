{{- $name := include "drupal.databaseSecretName" . -}}
{{- include "drupal.assertAvailable" (dict "root" . "apiVersion" "v1" "kind" "Secret" "name" $name "allowAdoption" true) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := deepCopy (default (dict) (and $existing $existing.data)) -}}
{{- if not (get $data "database") }}{{- $_ := set $data "database" (include "drupal.databaseAuthDatabase" . | b64enc) -}}{{- end }}
{{- if not (get $data "username") }}{{- $_ := set $data "username" (include "drupal.databaseAuthUsername" . | b64enc) -}}{{- end }}
{{- if not (get $data "password") }}{{- $_ := set $data "password" (randAlphaNum 48 | b64enc) -}}{{- end }}
{{- if not (get $data "root-password") }}{{- $_ := set $data "root-password" (randAlphaNum 48 | b64enc) -}}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drupal.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
  annotations:
    {{- include "drupal.protectionAnnotations" . | nindent 4 }}
    helm.sh/resource-policy: keep
type: Opaque
immutable: true
data:
  {{- toYaml $data | nindent 2 }}
