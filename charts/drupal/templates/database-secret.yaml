{{- if and .Values.database.auth.create (not .Values.database.auth.existingSecret) }}
{{- $name := include "drupal.databaseName" . -}}
{{- include "drupal.assertAvailable" (dict "root" . "apiVersion" "v1" "kind" "Secret" "name" $name "allowAdoption" true) }}
{{- $database := include "drupal.databaseAuthDatabase" . | b64enc -}}
{{- $username := include "drupal.databaseAuthUsername" . | b64enc -}}
{{- $password := .Values.database.auth.password | default (randAlphaNum 48) | b64enc -}}
{{- $rootPassword := .Values.database.auth.rootPassword | default (randAlphaNum 48) | b64enc -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if $existing -}}
  {{- $data := default (dict) $existing.data -}}
  {{- $database = (get $data "database") | default $database -}}
  {{- $username = (get $data "username") | default $username -}}
  {{- $password = (get $data "password") | default $password -}}
  {{- $rootPassword = (get $data "root-password") | default $rootPassword -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drupal.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
  annotations:
    {{- include "drupal.protectionAnnotations" . | nindent 4 }}
    helm.sh/resource-policy: keep
type: Opaque
immutable: true
data:
  database: {{ $database | quote }}
  username: {{ $username | quote }}
  password: {{ $password | quote }}
  root-password: {{ $rootPassword | quote }}
{{- end }}
